<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Portal App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="main-screen" class="container">
        <h1 class="title">WORK PORTAL</h1>
        <div class="grid-layout">
            <button class="btn btn-blue" onclick="openAttendanceModal()">
                <span class="btn-text">出勤</span>
                <span class="btn-sub">Start Work</span>
            </button>
            <button class="btn btn-orange" onclick="openLeaveModal()">
                <span class="btn-text">退勤</span>
                <span class="btn-sub">End Work</span>
            </button>
            <button class="btn btn-office" onclick="handleAction('出社報告')">
                <span class="btn-text">出社報告</span>
                <span class="btn-sub">Office Check-in</span>
            </button>
            <button class="btn btn-green" onclick="handleAction('日報')">
                <span class="btn-text">日報</span>
                <span class="btn-sub">Daily Report</span>
            </button>
            <button class="btn btn-purple" onclick="toggleMenu('monthly-screen')">
                <span class="btn-text">月報</span>
                <span class="btn-sub">Monthly Report</span>
            </button>
        </div>
    </main>

    <section id="monthly-screen" class="container hidden">
        <h1 class="title">MONTHLY REPORT</h1>
        <div class="grid-layout triple">
            <button class="btn btn-blue" onclick="handleAction('週次報告')">
                <span class="btn-text">週次</span>
                <span class="btn-sub">Weekly</span>
            </button>
            <button class="btn btn-green" onclick="handleAction('月間報告')">
                <span class="btn-text">月間</span>
                <span class="btn-sub">Monthly</span>
            </button>
            <button class="btn btn-orange" onclick="handleAction('評価報告')">
                <span class="btn-text">評価</span>
                <span class="btn-sub">Evaluation</span>
            </button>
        </div>
        <button class="back-link" onclick="toggleMenu('main-screen')">
            ← 戻る
        </button>
    </section>

    <div id="attendance-modal" class="modal-overlay hidden">
        <div class="modal-content scrollable">
            <h2 class="modal-title" style="color: var(--blue);">出勤報告</h2>
            <div class="input-group">
                <label>日付</label>
                <input type="date" id="report-date">
            </div>
            <div class="input-group">
                <label>出勤時間</label>
                <input type="time" id="start-time" value="09:00">
            </div>
            <div class="input-group">
                <label>種別</label>
                <select id="work-type">
                    <option value="通常">通常出勤</option>
                    <option value="リモート">リモート</option>
                    <option value="直行">直行</option>
                </select>
            </div>
            <div class="input-group">
                <div class="template-header">
                    <label>コメント</label>
                    <button class="mini-btn" onclick="openTemplateManager('start')">
                        編集/追加
                    </button>
                </div>
                <div id="start-template-container" class="template-bar"></div>
                <textarea id="comment" rows="3" placeholder="本日の予定など"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeAllModals()">
                    キャンセル
                </button>
                <button class="btn-primary" style="--btn-color: var(--blue);" onclick="submitAttendance()">
                    報告
                </button>
            </div>
        </div>
    </div>

    <div id="leave-modal" class="modal-overlay hidden">
        <div class="modal-content scrollable">
            <h2 class="modal-title" style="color: var(--orange);">退勤報告</h2>
            <div class="input-group">
                <label>日にち</label>
                <input type="date" id="leave-date">
            </div>
            <div class="input-group">
                <label>出勤時間</label>
                <input type="time" id="leave-start-time" oninput="calculateWorkHours()">
            </div>
            <div class="input-group">
                <label>退勤時間</label>
                <input type="time" id="end-time" value="17:30" oninput="calculateWorkHours()">
            </div>
            <div class="input-group">
                <label>実稼働時間 (休憩控除済)</label>
                <input type="text" id="work-hours" readonly placeholder="0.00">
            </div>
            <div class="input-group">
                <div class="template-header">
                    <label>業務内容</label>
                    <button class="mini-btn" onclick="openTemplateManager('end')">
                        編集/追加
                    </button>
                </div>
                <div id="end-template-container" class="template-bar"></div>
                <textarea id="work-content" rows="4" placeholder="本日の業務内容"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeAllModals()">
                    キャンセル
                </button>
                <button class="btn-primary" style="--btn-color: var(--orange);" onclick="submitLeave()">
                    報告
                </button>
            </div>
        </div>
    </div>

    <div id="template-manager-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="mgr-title" class="modal-title">テンプレート編集</h3>
            <div class="input-group">
                <label>新規追加</label>
                <div class="add-box">
                    <input type="text" id="mgr-new-input" placeholder="例：会議">
                    <button class="mini-btn add-action" id="mgr-add-btn">
                        追加
                    </button>
                </div>
                <p id="mgr-error" style="color: #ff4d4d; font-size: 0.7rem; margin-top: 5px; display: none;">
                    すでに追加済です。
                </p>
            </div>
            <label style="font-size: 0.75rem; opacity: 0.8;">登録済み（クリックで削除）</label>
            <div id="mgr-list" class="template-bar mgr-list-area"></div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeTemplateManager()" style="width: 100%;">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
