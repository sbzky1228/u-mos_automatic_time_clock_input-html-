
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-MOS 出退勤入力</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>U-MOS 出退勤入力</h1>
    <div class="buttons">
        <button id="inBtn" type="button" onclick="showForm('in')">出勤</button>
        <button id="outBtn" type="button" onclick="showForm('out')">退勤</button>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeForm()">&times;</span>
            <form id="inForm" class="form hidden" onsubmit="submitForm(event, 'in')">
                <h2>出勤</h2>
                <label>出勤時間: <input type="time" name="in_time" id="inTime" required></label>
                <div class="time-suggestions" id="inTimeSuggestions" aria-hidden="false"></div>
                <br>
                <label>種別:
                    <select name="in_type">
                        <option value="客先">客先</option>
                        <option value="遅刻">遅刻</option>
                        <option value="有給">有給</option>
                    </select>
                </label><br>
                <label>日にち: <input type="date" name="in_date" required></label><br>
                <label>コメント: <input type="text" name="in_comment" id="inComment" maxlength="120" placeholder="（任意）120文字以内"></label>
                <div class="char-count" id="inCommentCount">120</div>
                <button type="submit">送信</button>
            </form>

            <form id="outForm" class="form hidden" onsubmit="submitForm(event, 'out')">
                <h2>退勤</h2>
                <label>退勤時間: <input type="time" name="out_time" id="outTime" required></label>
                <div class="time-suggestions" id="outTimeSuggestions"></div>
                <br>
                <label>出勤時間（任意）: <input type="time" name="out_in_time" id="outInTime" placeholder="出勤時間を入力（任意）"></label>
                <div class="time-suggestions" id="outInTimeSuggestions"></div>
                <br>
                <label>実績時間: <input type="text" id="actualHours" name="actual_hours" readonly></label><br>
                <label>日にち: <input type="date" name="out_date" required></label><br>
                <label>業務内容: 
                    <div class="task-input-wrapper">
                        <input type="text" name="out_task" id="taskInput" maxlength="120" oninput="onOutTaskInput()" onfocus="showTaskDropdown()" onblur="hideTaskDropdown()">
                        <div id="taskDropdown" class="task-dropdown hidden">
                            <input class="task-search" id="taskSearch" placeholder="テンプレートを検索" oninput="filterTaskDropdown(this.value)">
                            <div class="task-list" id="taskList"></div>
                        </div>
                    </div>
                </label>
                <div class="char-count" id="outTaskCount">120</div>
                <button type="button" onclick="openAddTemplateModal()" class="add-template-btn">テンプレート追加</button><br>
                <button type="submit">送信</button>
            </form>
        </div>
    </div>

    <div id="templateModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddTemplateModal()">&times;</span>
            <h2>テンプレート追加</h2>
            <div id="templateError" class="template-error hidden"></div>
            <label>新しいテンプレート: <input type="text" id="newTemplateInput" placeholder="追加したいテンプレートを入力" oninput="checkTemplateInput()"></label><br>
            <button type="button" onclick="addTemplate()">追加</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
